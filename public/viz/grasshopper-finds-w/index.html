<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The grasshopper finds w</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/blue.css">
</head>
<body>
<div id="viewport">
  <div id="stage" class="still" role="img"
       aria-label="A grasshopper finds the rate w of a data plan by measuring the slope of the loss and stepping down it">
    <svg id="svg-back" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <div id="html-mid" class="layer"></div>
    <svg id="svg-front" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <div id="html-top" class="layer"></div>
    <div id="title">The grasshopper finds <span class="w">w</span></div>
    <div id="controls">
      <button id="next" type="button" title="Next (right arrow, space, page down)">Next <span class="chev">&#8250;</span></button>
      <div id="play" role="group" aria-label="Play">
        <button id="play1" class="play" type="button" title="Play everything (p plays or pauses)" aria-label="Play everything"><span class="tri"></span></button>
        <button id="play2" class="play" type="button" title="Play quickly: the slope straight from the tangent" aria-label="Play quickly"><span class="tri"></span><span class="tri"></span></button>
        <button id="play3" class="play" type="button" title="Play only the jumps" aria-label="Play only the jumps"><span class="tri"></span><span class="tri"></span><span class="tri"></span></button>
      </div>
      <span id="where"></span>
      <button id="theme" type="button" title="Theme (t)" aria-label="Switch the theme">&#9680;</button>
    </div>
  </div>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script src="js/math.js"></script>
<script src="js/kit.js"></script>
<script src="js/layout.js"></script>
<script src="js/hopper.js"></script>
<script src="js/black.js"></script>
<script src="js/red.js"></script>
<script src="js/blue.js"></script>
<script src="js/purple.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
