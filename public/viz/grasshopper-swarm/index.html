<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight grasshoppers, four bends</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/story.css">
</head>
<body>
<div id="viewport">
  <div id="stage" class="still" role="img"
       aria-label="Lina counts the aphids on her rose for eight evenings; a sum of four ReLUs learns the curve, with one grasshopper on each of its eight numbers, and tells her whether one box of ladybirds will do on day 10">
    <svg id="svg-back" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <div id="html-mid" class="layer"></div>
    <svg id="svg-front" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <div id="html-top" class="layer"></div>
    <div id="title">Eight grasshoppers, four bends</div>
    <div id="controls">
      <button id="next" class="btn" type="button" title="Next (right arrow, space, page down)">Next <span class="chev">&#8250;</span></button>
      <span class="runs">
        <button id="plus1" class="btn run" type="button" title="The next iteration">+1</button>
        <button id="plus10" class="btn run" type="button" title="Ten iterations on">+10</button>
        <button id="plus100" class="btn run" type="button" title="A hundred iterations on">+100</button>
        <button id="play" class="btn run" type="button" title="Play until the curve stops moving (p)" aria-label="Play">&#9654;</button>
      </span>
      <span id="where"></span>
      <button id="theme" type="button" title="Theme (t)" aria-label="Switch the theme">&#9680;</button>
    </div>
  </div>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script src="js/swarm-math.js"></script>
<script src="js/kit.js"></script>
<script src="js/layout.js"></script>
<script src="js/hopper.js"></script>
<script src="js/plot.js"></script>
<script src="js/story.js"></script>
<script src="js/black.js"></script>
<script src="js/red.js"></script>
<script src="js/blue.js"></script>
<script src="js/purple.js"></script>
<script src="js/coda.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
