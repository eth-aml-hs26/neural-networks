<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A deconvolutional filter</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/story.css">
</head>
<body>
<div id="viewport">
  <div id="stage" class="still" role="img"
       aria-label="A deconvolutional filter step by step: a 2 by 2 input and a kernel; each input cell stamps its value times the kernel into the output, 2 cells apart, and where the copies overlap they add; then the slide's view, the input spread out with one zero between its cells and padded with three zeros, the 4 by 4 kernel slid over it, every window giving one cell of the same 6 by 6 output">
    <svg id="drawing" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <div id="html-mid" class="layer"></div>
    <div id="words"><h2></h2><p></p></div>
    <div id="html-top" class="layer"></div>
    <div id="title">A deconvolutional filter</div>
    <div id="controls">
      <button id="back" class="btn quiet" type="button" title="Back (left arrow)" aria-label="Back"><span class="chev">&#8249;</span></button>
      <button id="next" class="btn" type="button" title="Next (right arrow, space, page down)">Next <span class="chev">&#8250;</span></button>
      <div id="play" role="group" aria-label="Play">
        <button id="play1" class="play" type="button" title="Play everything, the story and the steps (p plays or pauses)" aria-label="Play everything"><span class="tri"></span></button>
        <button id="play2" class="play" type="button" title="Play the steps only" aria-label="Play the steps"><span class="tri"></span><span class="tri"></span></button>
        <button id="play3" class="play" type="button" title="Play the steps quickly, without their animations" aria-label="Play the steps quickly"><span class="tri"></span><span class="tri"></span><span class="tri"></span></button>
      </div>
      <span id="where"></span>
      <button id="theme" type="button" title="Theme (t)" aria-label="Switch the theme">&#9680;</button>
    </div>
  </div>
  <div id="turn">Turn the phone sideways to see the whole page.</div>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script src="js/math.js"></script>
<script src="js/words.js"></script>
<script src="js/kit.js"></script>
<script src="js/layout.js"></script>
<script src="js/steps.js"></script>
<script src="js/story.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
