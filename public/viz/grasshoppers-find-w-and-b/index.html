<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two grasshoppers find w and b</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/parts.css">
<link rel="stylesheet" href="css/story.css">
</head>
<body>
<div id="viewport">
  <div id="stage" class="still" role="img"
       aria-label="Two grasshoppers find w and b of the heating model yhat = ReLU(w x + b) for one day, each measuring the slope of the loss along its own number">
    <svg id="svg-back" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <div id="html-mid" class="layer"></div>
    <svg id="svg-front" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <div id="html-top" class="layer"></div>
    <div id="title">Two grasshoppers find <span class="m">w</span> and <span class="m">b</span></div>
    <div id="controls">
      <button id="next" type="button" title="Next (right arrow, space, page down)">Next <span class="chev">&#8250;</span></button>
      <span id="where"></span>
      <button id="theme" type="button" title="Theme (t)" aria-label="Switch the theme">&#9680;</button>
    </div>
  </div>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script src="js/math.js"></script>
<script src="js/kit.js"></script>
<script src="js/layout.js"></script>
<script src="js/hopper.js"></script>
<script src="js/story.js"></script>
<script src="js/black.js"></script>
<script src="js/red.js"></script>
<script src="js/ground.js"></script>
<script src="js/blue.js"></script>
<script src="js/purple.js"></script>
<script src="js/coda.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
